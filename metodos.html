<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Métodos</title>

    <link rel="stylesheet" href="style/metodos.css">

    <!-- FUENTE -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            <span class="pig">🐷</span>
            <h2>Coink</h2>
        </div>

        <nav class="menu">
            <a class="active" href="#">Aprender</a>
            <a href="#">Contactanos</a>
            <a href="#">Sobre Nosotros</a>

            <div class="pink-btn"></div>

            <a href="#">More</a>
        </nav>

    </header>

    <!-- CONTENEDOR -->
    <main class="container">

        <!-- TITULO -->
        <div class="title">
            <h1>MÉTODOS</h1>
        </div>

        <!-- TARJETAS -->
        <section class="cards">

            <!-- CARD -->
            <label class="card">

                <input type="radio" name="metodo">

                <div class="card-box">

                    <img src="img/HORMIGA 3.png">

                    <h3>Hormiga</h3>

                </div>

            </label>

            <!-- CARD -->
            <label class="card">

                <input type="radio" name="metodo">

                <div class="card-box">

                    <img src="img/META 2.png">

                    <h3>METAS</h3>

                </div>

            </label>

            <!-- CARD -->
            <label class="card">

                <input type="radio" name="metodo">

                <div class="card-box">

                    <img src="img/img invertido.png">

                    <h3>INVERTIDO</h3>

                </div>

            </label>

            <!-- CARD -->
            <label class="card">

                <input type="radio" name="metodo">

                <div class="card-box">

                    <img src="img/img sobres.png">

                    <h3>SOBRES</h3>

                </div>

            </label>

        </section>

        <!-- RECORDATORIO -->
        <section class="recordatorio">

            <div class="icon">
                🔔
            </div>

            <div class="text">

                <h4>RECUERDA</h4>

                <p>
                    “Ahorrar no se trata de cuánto ganas,
                    sino de cuánto decides guardar con propósito.”
                </p>

            </div>

        </section>

    </main>

</body>
</html>
