<script>
// Guardamos el nombre del usuario que viene de PHP para calcular las iniciales
const nombreParaInicial = "<?php echo addslashes($nombreUsuario); ?>";

document.addEventListener("DOMContentLoaded", function() {
    actualizarAvatar();
});

// FUNCIÓN UNIFICADA: Controla si se pinta la foto o el círculo morado con iniciales
function actualizarAvatar() {
    const fotoGuardada = localStorage.getItem("foto_perfil_personalizada");
    const imgElement = document.getElementById("foto");
    const initialsElement = document.getElementById("iniciales");

    if (imgElement && initialsElement) {
        if (fotoGuardada && fotoGuardada !== "null" && fotoGuardada !== "") {
            // 1. Si el usuario ya subió una foto personalizada, la fuerza a mostrarse ganándole al CSS
            imgElement.src = fotoGuardada;
            imgElement.style.setProperty("display", "block", "important");
            initialsElement.style.setProperty("display", "none", "important");
        } else {
            // 2. Si no tiene foto, genera automáticamente el avatar con su inicial (Ej: "O")
            imgElement.style.setProperty("display", "none", "important");
            initialsElement.style.setProperty("display", "flex", "important");
            
            // Saca la primera letra de tu nombre en mayúsculas
            const primeraLetra = nombreParaInicial.trim().charAt(0).toUpperCase();
            initialsElement.textContent = primeraLetra || "U";
        }
    }
}

function actualizarAvatar() {
    const fotoGuardada = localStorage.getItem("foto_perfil_personalizada");
    const container = document.querySelector(".avatar-container");
    const imgElement = document.getElementById("foto");
    const initialsElement = document.getElementById("iniciales");

    if (container && imgElement && initialsElement) {
        if (fotoGuardada && fotoGuardada !== "null" && fotoGuardada !== "") {
            // 1. Si el usuario tiene una foto asignada
            imgElement.src = fotoGuardada;
            container.classList.add("con-foto"); // Activa las reglas CSS de visualización
        } else {
            // 2. Si no tiene foto, remueve la clase y calcula la inicial automáticamente
            container.classList.remove("con-foto");
            
            const primeraLetra = nombreParaInicial.trim().charAt(0).toUpperCase();
            initialsElement.textContent = primeraLetra || "U";
        }
    }
}

function cambiarFotoPersonalizada(event) {
    const archivo = event.target.files[0];
    if (!archivo) return;

    const lector = new FileReader();
    lector.onload = function(e) {
        const urlImagenBase64 = e.target.result;
        
        // Guarda los datos de la imagen directamente en el almacenamiento local
        localStorage.setItem("foto_perfil_personalizada", urlImagenBase64);
        
        // Refresca visualmente el estado del contenedor
        actualizarAvatar();
    };
    lector.readAsDataURL(archivo);
}
</script>
